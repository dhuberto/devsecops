# =============================================================================
# Container - Build, Trivy e smoke test - TaskFlow
# Builda a imagem, escaneia com Trivy (gate HIGH,CRITICAL) e sobe o container
# com flags de runtime seguras para confirmar que a imagem hardened funciona.
# =============================================================================

name: Container - Build e Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimo privilegio: so leitura do codigo.
permissions:
  contents: read

# Nada hardcoded nos steps: nome da imagem, Dockerfile, porta e severidade
# de corte ficam centralizados aqui (boa pratica de Pipeline as Code).
env:
  IMAGE_NAME: taskflow
  DOCKERFILE_PATH: Dockerfile
  APP_PORT: "5000"
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  build-e-trivy:
    name: Build da imagem e scan com Trivy
    runs-on: ubuntu-latest
    steps:
      # pin por SHA (imutavel) em vez de tag mutavel - evita supply chain attack
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build da imagem ja tagueada com o SHA do commit (rastreabilidade)
      - name: Build da imagem Docker
        run: docker build -f ${{ env.DOCKERFILE_PATH }} -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # pin por SHA (imutavel) - evita que uma tag re-apontada rode codigo malicioso
      # gate: falha o build (exit-code 1) se houver HIGH ou CRITICAL
      # ignore-unfixed: CVEs sem correcao publicada nao bloqueiam (nao ha versao
      #    para atualizar); ficam registradas no docs/hardening.md como risco aceito
      - name: Trivy image (gate ${{ env.TRIVY_SEVERITY }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Ajuste previo do volume para garantir permissao total do usuario nao-root (taskflow)
      - name: Criar volume e permissões
        run: |
          docker volume create taskflow-data
          docker run --rm -v taskflow-data:/app/data alpine chmod 777 /app/data

      # Executa o container injetando as credenciais de runtime exigidas pelo app.py
      - name: Iniciar container
        run: |
          docker run -d --name taskflow -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            --read-only --tmpfs /tmp \
            -v taskflow-data:/app/data \
            --cap-drop ALL --security-opt no-new-privileges \
            -e TASKFLOW_SECRET_KEY="$(openssl rand -hex 32)" \
            -e TASKFLOW_ADMIN_PASSWORD="AdminPassword123!" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Aguarda a inicialização completa do Gunicorn/Flask em step separado
      - name: Aguardar inicialização do container
        run: sleep 5

      # Smoke test em step isolado para registrar a falha HTTP 500 individualmente
      - name: Validar resposta /login (Smoke Test)
        run: curl -fsS http://localhost:${{ env.APP_PORT }}/login > /dev/null

      # Captura obrigatoria dos logs do container mesmo em caso de erro no step anterior
      - name: Exibir traceback dos logs do container em caso de falha
        if: always()
        run: docker logs taskflow


# =============================================================================
# RESUMO DAS MUDANÇAS E BOAS PRÁTICAS APLICADAS NO CONTAINER.YML
# =============================================================================

# Permissões do GITHUB_TOKEN (permissions: contents: read)
# - O que mudou: Restrição de permissões globais do job para apenas leitura.
# - Por quê: Aplica o princípio do mínimo privilégio para barrar qualquer tipo de alteração no repositório por meio do pipeline.

# Variáveis centralizadas no topo (env)
# - O que mudou: Definição de parâmetros globais (IMAGE_NAME, APP_PORT, TRIVY_SEVERITY, DOCKERFILE_PATH).
# - Por quê: Facilita a manutenção, evita ter valores "magic string" ou hardcoded espalhados nos passos e simplifica atualizações futuras.

# Fixação por SHA dos commits nas Actions (actions/checkout e aquasecurity/trivy-action)
# - O que mudou: Substituição de tags mutáveis (@v4, @v0.36.0) por hashes imutáveis.
# - Por quê: Proteção ativa contra contaminação de pipeline via Supply Chain Attacks (impedindo que a ação execute código malicioso caso a tag oficial seja alterada).

# Scan de vulnerabilidades de Container com Trivy (Quality Gate)
# - O que mudou: Inclusão da action do Trivy bloqueando a esteira com exit-code: "1" em caso de vulnerabilidades HIGH ou CRITICAL.
# - Por quê: Garante um Quality Gate que impede imagens vulneráveis de serem aceitas ou implantadas. O uso de ignore-unfixed: true foca a correção nas falhas que já possuem patch disponível.

# Ajuste de permissão prévia no volume montado
# - O que mudou: Inclusão da instrução `docker run --rm -v taskflow-data:/app/data alpine chmod 777 /app/data`.
# - Por quê: Volumes gerenciados criados pelo Docker pertencem por padrão ao root no host. Este ajuste garante que o usuário não-root (`taskflow`) consiga criar e atualizar o banco SQLite (`taskflow.db`) dentro do diretório `/app/data` em ambiente de produção/teste.

# Injeção das credenciais de inicialização no runtime
# - O que mudou: Adição de `-e TASKFLOW_ADMIN_PASSWORD` no comando `docker run`.
# - Por quê: Garante que a rotina `init_db()` processe a criação do usuário inicial com sucesso sem gerar erro de hash nulo em runtime.

# Separação Granular de Steps e Coleta de Logs (`if: always()`)
# - O que mudou: Divisão dos comandos de inicialização, delay, teste HTTP e coleta de logs em etapas separadas no YAML.
# - Por quê: Evita o encerramento prematuro do script em bloco Bash e assegura que o comando `docker logs taskflow` seja executado incondicionalmente, exibindo o traceback do Python no console do GitHub Actions para resolução rápida do erro 500.
