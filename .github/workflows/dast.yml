# ==============================================================================
# ARQUIVO: .github/workflows/dast.yml
# DESCRIÇÃO: Workflow de DAST executando ZAP Baseline com espera ativa (healthcheck)
# ==============================================================================
name: DAST Baseline Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap_scan:
    name: Subir TaskFlow e Executar ZAP Baseline
    runs-on: ubuntu-latest
    
    steps:
      # BLOCO 1: Checkout do Código
      - name: Checkout repository
        uses: actions/checkout@v4

      # BLOCO 2: Build da Imagem Docker da Aplicação
      - name: Build TaskFlow Image
        run: |
          docker build -t taskflow:test .

      # BLOCO 3: Inicialização da Aplicação em Background
      - name: Run TaskFlow Container
        run: |
          docker run -d --name taskflow-app -p 5000:5000 \
            -e TASKFLOW_SECRET_KEY="secret-ci-key" \
            taskflow:test

      # BLOCO 4: Espera Ativa (Healthcheck) - Evita "ZAP atacando o nada"
      - name: Wait for TaskFlow Availability
        run: |
          echo "Aguardando aplicação responder em http://localhost:5000/login..."
          for i in {1..30}; do
            if curl -s -f http://localhost:5000/login > /dev/null; then
              echo "Aplicação no ar!"
              exit 0
            fi
            echo "Aguardando..."
            sleep 2
          done
          echo "Erro: Aplicação não respondeu no tempo limite."
          docker logs taskflow-app
          exit 1

      # BLOCO 5: Execução do ZAP Baseline Scan
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000/'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: true

      # BLOCO 6: Publicação do Relatório como Artefato
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_md.md

# ==============================================================================
# RESUMO: O job realiza a espera ativa no endpoint /login antes de rodar o scan,
# garantindo que o DAST execute contra a aplicação ativa e salve o artefato.
# ==============================================================================
