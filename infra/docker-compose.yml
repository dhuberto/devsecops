# ==============================================================================
# ARQUIVO: docker-compose.yml
# DESCRIÇÃO: Orquestração segura multi-serviço (Web + PostgreSQL + Observabilidade)
# ==============================================================================
version: '3.8'

# ------------------------------------------------------------------------------
# BLOCO 1: Definição de Redes Isoladas (Frontend e Backend)
# ------------------------------------------------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    internal: true # Sem acesso à internet direta ou exposição externa inadvertida

# ------------------------------------------------------------------------------
# BLOCO 2: Serviços de Infraestrutura e Aplicação
# ------------------------------------------------------------------------------
services:
  # Serviço de Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_pass_secure}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_db}
    networks:
      - backend # Conectado APENAS à rede backend isolada
    # ATENÇÃO: A porta 5432 NÃO é exposta ao host para evitar acesso externo direto
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Serviço Web TaskFlow
  web:
    build: .
    container_name: taskflow-web
    ports:
      - "5000:5000"
    environment:
      TASKFLOW_SECRET_KEY: ${TASKFLOW_SECRET_KEY}
      FLASK_DEBUG: "0"
    networks:
      - frontend
      - backend
    read_only: true # Filesystem raiz como somente leitura
    tmpfs:
      - /tmp
      - /run
    volumes:
      - ./logs:/app/logs # Volume montado especificamente para escrita de logs
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

# ==============================================================================
# RESUMO: O arquivo assegura isolamento de rede, ausência de portas expostas no DB,
# limites de CPU/Memória, filesystem read-only e verificação de saúde (healthcheck).
# ==============================================================================
