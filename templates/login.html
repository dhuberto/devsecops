<!--
==============================================================================
ARQUIVO: templates/login.html
DESCRIÇÃO: Form de login renderizando mensagens de erro com autoescape Jinja2
==============================================================================
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Login</title>
</head>
<body>
    <h2>Login no TaskFlow</h2>
    
    <!-- BLOCO DE ERRO: Renderizado via Jinja2 sem utilizar o filtro | safe -->
    {% if error %}
        <div style="color: red;" id="error-message">
            <p>{{ error }}</p>
        </div>
    {% endif %}

    <form method="POST" action="/login">
        <label>Usuário:</label><br>
        <input type="text" name="username" required><br><br>
        
        <label>Senha:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
<!--
==============================================================================
RESUMO: O uso de {{ error }} sem o filtro | safe previne XSS refletido.
==============================================================================
-->
