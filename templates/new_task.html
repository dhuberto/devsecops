<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>TaskFlow - Nova Tarefa</title>
</head>
<body>
  <h1>Nova tarefa</h1>

  {# Restricoes no lado do cliente (required, maxlength) ajudam na defesa #}
  {# em profundidade contra payloads grandes. #}
  <form method="post">
    <div>
      <label for="title">Título:</label><br>
      <input type="text" id="title" name="title" required maxlength="100">
    </div>
    <br>
    <div>
      <label for="description">Descrição:</label><br>
      <textarea id="description" name="description" maxlength="500" rows="4" cols="40"></textarea>
    </div>
    <br>
    <input type="submit" value="Salvar">
  </form>

  <br>
  {# Uso do url_for() para roteamento dinamico seguro mantido pelo Flask. #}
  <a href="{{ url_for('tasks') }}">Voltar</a>
</body>
</html>
