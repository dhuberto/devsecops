<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>TaskFlow - Minhas Tarefas</title>
</head>
<body>
  <!-- Variaveis vindas do contexto do Flask sao saneadas automaticamente no HTML. -->
  <h1>Minhas tarefas ({{ username }})</h1>

  <!-- Formulario de busca via GET com autopreenchimento seguro do termo buscado. -->
  <form method="get">
    <input type="text" name="q" placeholder="buscar tarefa" value="{{ search }}">
    <input type="submit" value="Buscar">
  </form>

  <!-- Iteracao das tarefas cadastradas no SQLite. -->
  <ul>
    {% for row in rows %}
    <li>
      <b>{{ row["title"] }}</b> - {{ row["description"] }}
      {% if row["done"] %}(feita){% endif %}
    </li>
    {% else %}
    <li>Nenhuma tarefa encontrada.</li>
    {% endfor %}
  </ul>

  <!-- Navegacao segura do sistema por rotas nomeadas. -->
  <a href="{{ url_for('new_task') }}">Nova tarefa</a> |
  <a href="{{ url_for('logout') }}">Sair</a>
</body>
</html>
